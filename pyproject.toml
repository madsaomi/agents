[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "second-brain-template"
version = "0.3.0"
description = "Second Brain — executable rules, memory and Plan-First workflow for AI coding agents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["ai-agents", "second-brain", "memory", "claude-code", "mcp", "plan-first"]
dependencies = []  # stdlib-only by design; extras below

[project.optional-dependencies]
# Python MCP SDK для сервера brain-mcp (agents/mcp/brain_mcp.py), требуется Python 3.11+
mcp = ["mcp>=1.2"]

[project.urls]
Documentation = "https://github.com/your-org/second-brain-template#readme"

[tool.setuptools]
# Пакетные данные (шаблоны, конфиги) добавляются на Этапе 5 упаковки
packages = ["agents.mcp"]
