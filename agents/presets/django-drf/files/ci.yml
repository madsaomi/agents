# CI: Django + DRF (пресет django-drf)
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app_db
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: change-me
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff + black)
        run: |
          ruff check .
          black --check .

      - name: Check for unapplied migrations
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev

      - name: Tests (pytest)
        run: pytest --cov=apps --cov-report=term-missing
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
          POSTGRES_HOST: localhost
          REDIS_URL: redis://localhost:6379/0

      - name: Second Brain integrity
        run: |
          python agents/tools/check_integrity.py
          python brain.py sync --check
